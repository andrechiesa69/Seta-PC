<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mappa linee e biglietti</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a2a5e;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }

  /* fotocamera a tutto schermo come sfondo */
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:linear-gradient(160deg,#0a3a86,#061a3d); }
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.18); pointer-events:none; }

  /* contenuto in sovraimpressione */
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);
    max-width:640px; margin:0 auto; }
  .lines { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 4px; flex:0 0 auto; }
  .lines img { width:100%; height:auto; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.45)); }

  /* mappa: il riquadro centrale e' trasparente e coincide col biglietto */
  .mapwrap { position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
  .map { position:relative; width:100%; max-height:100%; aspect-ratio:1157/1009; }
  .map img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 0 2px rgba(0,0,0,.9)) drop-shadow(0 0 5px rgba(0,0,0,.45)); }
  /* cornice del biglietto (25.5% da sinistra, largo 54.45%) */
  .frame { position:absolute; left:25.497%; width:54.451%; top:0; bottom:0;
    border:2px dashed rgba(255,255,255,.75); border-radius:10px; pointer-events:none; }

  .buttons { display:flex; flex-direction:column; gap:8px; flex:0 0 auto; padding:0 4px; }
  .btn img { width:100%; height:auto; display:block; filter:drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  a { display:block; transition:transform .12s; }
  a:active { transform:scale(.96); }

  #camBtn { display:none; flex:0 0 auto; align-self:center; margin:0 0 8px; padding:10px 18px; border:0; border-radius:999px;
    background:#fff; color:#0a46a0; font-size:15px; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,.4); }
</style>
</head>

<script>
(function () {
  var video = document.getElementById('cam');
  var btn = document.getElementById('camBtn');
  var stream = null;

  function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
      .then(function (s) {
        stream = s; video.srcObject = s; btn.style.display = 'none';
        var p = video.play(); if (p && p.catch) p.catch(function () { btn.style.display = 'block'; });
      })
      .catch(function () { btn.style.display = 'block'; });  // permesso negato: resta lo sfondo blu, la pagina funziona lo stesso
  }
  function stop() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }

  btn.addEventListener('click', start);
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if (!stream) start(); });
  window.addEventListener('pagehide', stop);
  start();
})();
</script>
