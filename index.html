<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Mappa AR – Linee e biglietti</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    a-scene { position: fixed; inset: 0; }

    /* Messaggio di aiuto in alto */
    #hint {
      position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px);
      transform: translateX(-50%); z-index: 10;
      max-width: 90vw; padding: 8px 14px; border-radius: 999px;
      background: rgba(10, 70, 160, .88); color: #fff; font-size: 14px; text-align: center;
      pointer-events: none; transition: opacity .4s;
    }
    #hint.hidden { opacity: 0; }

    /* Errore camera */
    #error {
      display: none; position: fixed; inset: 0; z-index: 20; padding: 24px;
      background: #0a46a0; color: #fff; text-align: center;
      align-items: center; justify-content: center; flex-direction: column; font-size: 17px; line-height: 1.5;
    }
    #error button { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 10px; font-size: 16px; background: #fff; color: #0a46a0; }
  </style>
</head>
<body>

  <div id="hint">Inquadra la mappa per far apparire i link</div>

  <div id="error">
    <div id="error-text">Non riesco ad accedere alla fotocamera.<br>Consenti l'accesso alla camera nelle impostazioni del browser e riprova.</div>
    <button onclick="location.reload()">Riprova</button>
  </div>

  <!--
    Il target (targets.mind) è largo 1 unità; l'altezza è 3508/2480 = 1.4145 (formato A4 verticale).
    Le icone E56–E59 stanno SOPRA il bordo superiore (y > 0.707),
    i tre bottoni stanno SOTTO il bordo inferiore (y < -0.707).
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="e56" src="img/E56.png">
      <img id="e57" src="img/E57.png">
      <img id="e58" src="img/E58.png">
      <img id="e59" src="img/E59.png">
      <img id="viaggio"  src="img/viaggio.png">
      <img id="ricarica" src="img/ricarica.png">
      <img id="tessera"  src="img/tessera.png">
    </a-assets>

    <!-- Camera con cursore: il tocco sullo schermo diventa un raggio che colpisce gli elementi .clickable -->
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuseTimeout: 0; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target">

      <!-- ====== 4 LINEE (sopra la mappa) ====== -->
      <a-image class="clickable link" data-url="https://www.setaweb.it/linee_pc/In%20vigore%20dal%2015.09.2026%20al%2005.06.2027/E56.pdf"
               src="#e56" position="-0.39 0.86 0" width="0.23" height="0.23" alpha-test="0.05" transparent="true"></a-image>
      <a-image class="clickable link" data-url="https://www.setaweb.it/linee_pc/In%20vigore%20dal%2015.09.2026%20al%2005.06.2027/E57.pdf"
               src="#e57" position="-0.13 0.86 0" width="0.23" height="0.23" alpha-test="0.05" transparent="true"></a-image>
      <a-image class="clickable link" data-url="https://www.setaweb.it/linee_pc/In%20vigore%20dal%2015.09.2026%20al%2005.06.2027/E58.pdf"
               src="#e58" position="0.13 0.86 0"  width="0.23" height="0.23" alpha-test="0.05" transparent="true"></a-image>
      <a-image class="clickable link" data-url="https://www.setaweb.it/linee_pc/In%20vigore%20dal%2015.09.2026%20al%2005.06.2027/E59.pdf"
               src="#e59" position="0.39 0.86 0"  width="0.23" height="0.23" alpha-test="0.05" transparent="true"></a-image>

      <!-- ====== 3 BOTTONI (sotto la mappa) ====== -->
      <a-image class="clickable link" data-url="https://www.setaweb.it/acquisto-titoli-viaggio"
               src="#viaggio"  position="0 -0.85 0" width="0.9" height="0.18" alpha-test="0.05" transparent="true"></a-image>
      <a-image class="clickable link" data-url="https://www.setaweb.it/pc/ricarica-online"
               src="#ricarica" position="0 -1.06 0" width="0.9" height="0.18" alpha-test="0.05" transparent="true"></a-image>
      <a-image class="clickable link" data-url="https://www.setaweb.it/pc/acquisto-card-abbonamento"
               src="#tessera"  position="0 -1.27 0" width="0.9" height="0.18" alpha-test="0.05" transparent="true"></a-image>

    </a-entity>
  </a-scene>

  <script>
    // Apertura dei link al tocco
    AFRAME.registerComponent('open-link', {
      init: function () {
        var el = this.el;
        el.addEventListener('click', function () {
          var url = el.getAttribute('data-url');
          if (!url) return;
          // piccolo effetto "pressione"
          el.setAttribute('scale', '0.94 0.94 0.94');
          setTimeout(function () { el.setAttribute('scale', '1 1 1'); }, 150);
          // apre in una nuova scheda; se bloccato, apre nella stessa
          var w = window.open(url, '_blank', 'noopener');
          if (!w) window.location.href = url;
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      var scene = document.querySelector('a-scene');
      document.querySelectorAll('.link').forEach(function (el) { el.setAttribute('open-link', ''); });

      var hint = document.getElementById('hint');
      var target = document.getElementById('target');
      target.addEventListener('targetFound', function () { hint.classList.add('hidden'); });
      target.addEventListener('targetLost',  function () { hint.classList.remove('hidden'); });

      scene.addEventListener('arError', function () {
        document.getElementById('error').style.display = 'flex';
      });
    });
  </script>
</body>
</html>
